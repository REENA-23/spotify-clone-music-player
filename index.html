<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/utility.css">
    <link rel="shortcut icon" href="./icon/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left ">
            <div class="cancel">
                <img class="invert" src="./icon/cancel.svg" alt="cancel">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo">
                    <img class="invert" src="./icon/logo.svg" alt="Logo">
                </div>
                <ul>
                    <li><img class="invert" src="./icon/home.svg" alt="Home">Home</li>
                    <li><img class="invert" src="./icon/search.svg" alt="search">Search</li>
                </ul>
            </div>


            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <h2> Your Library</h2>

                </div>
                <div class="songlist">
                    <ul>
                    </ul>
                </div>
            </div>
            <div class="footer">
                <div><a href="https://www.spotify.com/in-en/legal/" data-encore-id="textLink" id=""> <span
                            data-encore-id="type">Legal</span></a></div>
                <div><a href="https://www.spotify.com/in-en/safetyandprivacy/" data-encore-id="textLink" id=""><span
                            data-encore-id="type">Safety &amp; Privacy Center</span></a></div>
                <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/" data-encore-id="textLink" id=""><span
                            data-encore-id="type">Privacy Policy</span></a></div>
                <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/" data-encore-id="textLink" id=""><span
                            data-encore-id="type">Cookies</span></a></div>
                <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" data-encore-id="textLink"
                        id=""><span data-encore-id="type">About Ads</span></a></div>
                <div><a href="https://www.spotify.com/in-en/accessibility/" data-encore-id="textLink" id=""><span
                            data-encore-id="type">Accessibility</span></a></div>
            </div>
        </div>


        <div class="right bg-grey rounded">
            <div class="header">
                <div class="nav">
                    <div class="flex">
                        <img class="invert hamburger" src="./icon/hamburger.svg" alt="">

                        <svg class="invert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"
                            height="24" color="#000000" fill="none">
                            <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <svg class="invert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"
                            height="24" color="#000000" fill="none">
                            <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>

                    </div>

                </div>

                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>
                </div>

            </div>
            <div class="spotify-playlist">
                <h1>Spotify PlayList</h1>
                <div class="cardContainer">
                   
                </div>
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="information">
                        <div class="songinfo">

                        </div>

                        <div class="songbuttons">
                            <img width="35" id="previous" src="./icon/previous.svg" alt="previous">
                            <img width="35" id="play" src="./icon/play.svg" alt="play">
                            <img width="35" id="next" src="./icon/next.svg" alt="next">
                        </div>
                        <div class="timenvol">
                            <div class="songtime">

                            </div>
                            <div class="volume">
                                <img class="invert" width="30" src="./icon/volume.svg" alt="">
                                <div class="range">
                                    <input type="range" name="volume">
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="./javascript/script.js"></script>
</body>

</html>
